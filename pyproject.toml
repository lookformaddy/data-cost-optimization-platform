[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-cost-optimization-platform"
version = "0.1.0"
description = "Warehouse cost observability and optimization: attribution, waste detection, advisor, budgets, savings ledger"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["dcop*"]
